# Deprecated for production baseline.
# Use deployment/linux/docker-compose.prod.yml for Linux production.
version: '3.8'

services:
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
    # No ports exposed - access only through Nginx (port 3000)
    # Internal port 3019 is still available for Nginx to connect
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - BACKEND_URL=${BACKEND_URL:-http://backend:3109}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - workplan-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    # No ports exposed - access only through Nginx (port 3000)
    # Internal port 3109 is still available for Nginx to connect
    environment:
      - NODE_ENV=production
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT:-3306}
    restart: unless-stopped
    networks:
      - workplan-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: workplan-nginx
    ports:
      - "3000:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - workplan-network
    restart: unless-stopped

networks:
  workplan-network:
    driver: bridge
