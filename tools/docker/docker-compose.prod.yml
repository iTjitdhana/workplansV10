version: '3.8'

services:
  frontend:
    image: ${DOCKER_USERNAME:-yourusername}/workplanv6-frontend:${VERSION:-latest}
    ports:
      - "3011:3011"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - BACKEND_URL=${BACKEND_URL:-http://backend:3101}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - workplan-network

  backend:
    image: ${DOCKER_USERNAME:-yourusername}/workplanv6-backend:${VERSION:-latest}
    ports:
      - "3101:3101"
    environment:
      - NODE_ENV=production
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT:-3306}
      - PRODUCTS_DB_NAME=${PRODUCTS_DB_NAME:-manufacturing_system}
    restart: unless-stopped
    networks:
      - workplan-network

networks:
  workplan-network:
    driver: bridge
